services:
  - type: web
    name: swapno-ai-demo
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: 24.22.1
      - key: JWT_SECRET
        generateValue: true
